<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文明の軌跡</title>
<style>
  :root{
    /* 歴史っぽい色。生成りの地に墨の文字、差し色は朱ひとつ */
    --paper:#efe9dc;      /* 生成り（地） */
    --paper-2:#e5ddcb;    /* 生成りの濃いほう */
    --sumi:#26221c;       /* 墨に近い黒（真っ黒にしない） */
    --sumi-2:#5a5348;     /* 薄い墨 */
    --line:#cdc3ad;       /* 罫 */
    --aka:#9b3b2f;        /* 差し色＝朱 */
    --aka-usu:#f2e3df;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    background:var(--paper); color:var(--sumi);
    display:flex; justify-content:center;
    line-height:1.9;
  }
  .app{
    width:100%; max-width:720px; min-height:100dvh;
    display:flex; flex-direction:column;
    background:var(--paper);
    position:relative; overflow:hidden;
  }

  /* ───── 上の帯 ───── */
  .head{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  .head .name{font-size:17px; font-weight:600; letter-spacing:.08em}
  .head .steps{margin-left:auto; text-align:right; line-height:1.35}
  .head .steps .n{font-size:19px; font-weight:600; color:var(--aka); letter-spacing:.02em}
  .head .steps .t{font-size:11px; color:var(--sumi-2)}

  .notice{
    padding:9px 16px; font-size:12px; line-height:1.6;
    background:var(--aka-usu); color:var(--aka);
    border-bottom:1px solid var(--line);
  }

  /* ───── 一覧 ───── */
  .list{padding:16px 16px 32px; display:flex; flex-direction:column; gap:12px}
  .list .lead{font-size:13px; color:var(--sumi-2); margin-bottom:2px}
  .card{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:15px 16px; font:inherit; color:inherit;
    display:flex; gap:14px; align-items:flex-start;
  }
  .card:active{background:var(--paper-2)}
  .card .no{
    flex:none; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--aka); color:var(--aka);
    display:grid; place-items:center; font-size:13px; margin-top:2px;
  }
  .card .body{flex:1; min-width:0; display:block}
  .card .ttl{display:block; font-size:17px; font-weight:600; letter-spacing:.04em; line-height:1.5}
  .card .sub{display:block; font-size:12px; color:var(--sumi-2); margin-top:3px}
  .card .q{display:block; font-size:14px; margin-top:7px; line-height:1.7}
  .card .tags{display:block; margin-top:8px}
  .card .seen{
    display:inline-block; font-size:11px; margin-right:6px;
    border:1px solid var(--sumi-2); color:var(--sumi-2);
    border-radius:3px; padding:2px 8px;
  }
  .card .soon{
    display:inline-block; font-size:11px;
    border:1px solid var(--line); color:var(--line);
    border-radius:3px; padding:2px 8px;
  }
  .card.is-seen{background:var(--paper-2)}

  /* ───── 物語 ───── */
  .play{display:none; flex-direction:column; flex:1; position:relative}
  .play.on{display:flex}
  .list.off{display:none}

  .stage{
    position:relative; flex:1; min-height:36dvh;
    background:linear-gradient(#d9d2c0 0%, #cdc4ae 100%);
    overflow:hidden;
  }
  .stage svg{position:absolute; inset:0; width:100%; height:100%}
  /* 背景の絵と、右側に立つ人物 */
  .stage img.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .stage img.ch{
    position:absolute; right:1%; bottom:0; height:100%;
    object-fit:contain; object-position:bottom right;
    opacity:1; transition:opacity .25s ease;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.28));
  }
  .stage img.ch.off{opacity:0}

  .talk{padding:0 14px 14px; background:var(--paper)}
  .who{
    display:inline-block; font-size:12px; letter-spacing:.12em;
    padding:5px 14px; border-radius:3px 3px 0 0; transform:translateY(1px);
    background:var(--sumi); color:var(--paper);
  }
  .talk.is-yos .who{background:var(--aka)}
  .box{
    border:1px solid var(--line); border-radius:0 4px 4px 4px;
    background:#fff; padding:16px 16px 12px;
    min-height:170px; display:flex; flex-direction:column;
  }
  .line{white-space:pre-wrap; font-size:16px; line-height:2.05; letter-spacing:.02em}
  .foot{margin-top:auto; display:flex; align-items:center; gap:10px; padding-top:10px}
  .next{
    margin-left:auto; background:none; border:none; font:inherit; cursor:pointer;
    color:var(--aka); font-size:14px; display:flex; align-items:center; gap:7px;
    padding:6px 2px;
  }
  .next i{
    width:23px;height:23px;border-radius:50%;border:1px solid currentColor;
    display:grid;place-items:center;font-size:11px;font-style:normal;
    animation:bob 1.7s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

  .prog{display:flex; gap:3px; padding:0 14px 12px}
  .prog i{height:2px; flex:1; background:var(--line); border-radius:1px}
  .prog i.on{background:var(--aka)}

  .ctrl{display:flex; align-items:center; gap:8px; padding:10px 14px 0}
  .btn{
    background:none; border:1px solid var(--line); border-radius:3px;
    font:inherit; font-size:13px; color:var(--sumi-2); cursor:pointer;
    padding:7px 13px;
  }
  .btn:active{background:var(--paper-2)}
  .btn.snd.off{color:var(--line)}

  .curtain{
    position:absolute; inset:0; z-index:5; display:grid; place-items:center;
    background:rgba(239,233,220,.94); text-align:center; padding:26px;
  }
  .curtain.hide{display:none}
  .curtain .t{font-size:19px; font-weight:600; letter-spacing:.05em; margin-bottom:12px}
  .curtain .q{font-size:15px; color:var(--aka); margin-bottom:16px; line-height:1.8}
  .curtain .s{font-size:13px; color:var(--sumi-2); margin-bottom:6px}
  .curtain .s2{font-size:12px; color:var(--sumi-2); opacity:.8}

  .end{padding:28px 16px 40px; text-align:center; display:none}
  .end.on{display:block}
  .end .t{font-size:17px; font-weight:600; margin-bottom:16px; letter-spacing:.04em}

  @media (max-width:400px){
    .card .ttl{font-size:16px}
    .line{font-size:16px; line-height:1.95}
    .head .name{font-size:16px}
  }

  /* ───── 横画面。縦に積むと本文が画面の下に隠れるので、左右に並べる ───── */
  @media (orientation:landscape) and (max-height:560px){
    .app{min-height:100dvh; max-width:none}
    .head{padding:7px 16px}
    .head .name{font-size:15px}
    .head .steps .n{font-size:16px}

    .play.on{
      display:grid; height:100dvh; overflow:hidden;
      grid-template-columns:46% 1fr;
      grid-template-rows:auto 1fr auto;
      grid-template-areas:
        "stage ctrl"
        "stage talk"
        "stage prog";
    }
    .stage{grid-area:stage; min-height:0; height:100%}
    .ctrl{grid-area:ctrl; padding:8px 14px 0}
    .btn{padding:5px 11px; font-size:12px}
    .talk{grid-area:talk; min-height:0; display:flex; flex-direction:column; padding:0 14px 6px}
    .who{align-self:flex-start}   /* 縦並びにすると名札が横いっぱいに伸びるので止める */
    /* 本文だけを中でスクロールさせ、「つづき」は下に貼り付けたままにする */
    .box{min-height:0; flex:1; overflow:hidden; padding:12px 14px 8px}
    .line{font-size:15px; line-height:1.85; flex:1 1 auto; min-height:0; overflow-y:auto}
    .foot{flex:none; margin-top:6px}
    .prog{grid-area:prog; padding:0 14px 8px}
    /* おしまいの画面は、本文があった場所にそのまま入れる */
    .end{grid-column:2; grid-row:2 / span 2; padding:18px 16px; overflow-y:auto}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="head">
    <div class="name" id="headName">文明の軌跡</div>
    <div class="steps">
      <div class="n" id="steps">99999</div>
      <div class="t">残り歩数</div>
    </div>
  </div>

  <div class="notice" id="notice">
    試運転版のため、歩数は減りません。ふだんは1,000歩で物語が1本ひらきます。
  </div>

  <!-- 一覧 -->
  <div class="list" id="list">
    <p class="lead">聞きたい場所を選んでください。</p>
  </div>

  <!-- 物語 -->
  <div class="play" id="play">
    <div class="stage" id="stage"></div>

    <div class="ctrl">
      <button class="btn" id="back">一覧へ</button>
      <button class="btn snd" id="snd">音声を止める</button>
    </div>

    <div class="talk is-nav" id="talk">
      <div class="who" id="who">ナレーション</div>
      <div class="box">
        <div class="line" id="line"></div>
        <div class="foot">
          <button class="next" id="next">つづき <i>▼</i></button>
        </div>
      </div>
    </div>

    <div class="prog" id="prog"></div>

    <div class="curtain" id="curtain">
      <div>
        <p class="t" id="curTitle"></p>
        <p class="q" id="curQ"></p>
        <p class="s">画面を押すと、物語が始まります</p>
        <p class="s2">音声が流れます。イヤホンをお使いください</p>
      </div>
    </div>

    <div class="end" id="end">
      <p class="t">おしまい</p>
      <button class="btn" id="toList">一覧へもどる</button>
    </div>
  </div>

</div>

<script>
"use strict";

/* ───── 10本の目録。中身（台本）は stories/<dir>/story.json に置く ───── */
const CATALOG = [
  {dir:"001-kinkakuji", title:"鹿苑寺（金閣寺）", pref:"京都府", person:"足利義満",  era:"室町",  q:"なぜ、いちばん下だけ金色ではないのか", ready:true},
  {dir:"002-gifujo",    title:"岐阜城",           pref:"岐阜県", person:"織田信長",  era:"戦国",  q:"なぜ「井ノ口」を「岐阜」に変えたのか", ready:true},
  {dir:"003-nagoyajo",  title:"名古屋城",         pref:"愛知県", person:"徳川家康",  era:"江戸初", q:"なぜ息子の城に金のしゃちほこを載せたのか", ready:true},
  {dir:"004-zuiganji",  title:"瑞巌寺",           pref:"宮城県", person:"伊達政宗",  era:"江戸初", q:"なぜ再建に五年もかけたのか", ready:true},
  {dir:"005-matsumoto", title:"松本城",           pref:"長野県", person:"石川数正",  era:"戦国",  q:"なぜ黒い城なのか", ready:true},
  {dir:"006-kenrokuen", title:"兼六園",           pref:"石川県", person:"前田綱紀",  era:"江戸",  q:"なぜ「兼六」という名なのか", ready:true},
  {dir:"007-himeji",    title:"姫路城",           pref:"兵庫県", person:"池田輝政",  era:"江戸初", q:"なぜ白い城なのか", ready:true},
  {dir:"008-kochijo",   title:"高知城",           pref:"高知県", person:"山内一豊",  era:"江戸初", q:"なぜ天守と御殿の両方が残っているのか", ready:true},
  {dir:"009-sengan",    title:"仙巌園",           pref:"鹿児島県", person:"島津斉彬", era:"幕末",  q:"なぜ桜島を庭の一部として見たのか", ready:true},
  {dir:"010-shokason",  title:"松下村塾",         pref:"山口県", person:"吉田松陰",  era:"幕末",  q:"なぜ一年ほどの塾から、あれだけの人が出たのか", ready:true}
];

const SEEN_KEY = "bunmei.seen";
function loadSeen(){
  try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"); }
  catch(e){ return []; }
}
function markSeen(dir){
  try {
    const s = loadSeen();
    if (s.indexOf(dir) < 0){ s.push(dir); localStorage.setItem(SEEN_KEY, JSON.stringify(s)); }
  } catch(e){ /* 保存できなくても物語は見られる */ }
}

/* ───── 一覧を描く ───── */
const elList = document.getElementById("list");
function drawList(){
  const seen = loadSeen();
  elList.querySelectorAll(".card").forEach(function(n){ n.remove(); });
  CATALOG.forEach(function(c, idx){
    const b = document.createElement("button");
    b.className = "card" + (seen.indexOf(c.dir) >= 0 ? " is-seen" : "");
    b.innerHTML =
      '<span class="no">' + (idx+1) + '</span>' +
      '<span class="body">' +
        '<span class="ttl">' + c.title + '</span>' +
        '<span class="sub">' + c.pref + '　' + c.person + '（' + c.era + '）</span>' +
        '<span class="q">' + c.q + '</span>' +
        '<span class="tags">' +
          (seen.indexOf(c.dir) >= 0 ? '<span class="seen">見た</span>' : '') +
          (c.ready ? '' : '<span class="soon">準備中</span>') +
        '</span>' +
      '</span>';
    b.addEventListener("click", function(){ open(c); });
    elList.appendChild(b);
  });
}

/* ───── 物語を開く ───── */
const elPlay    = document.getElementById("play");
const elStage   = document.getElementById("stage");
const elTalk    = document.getElementById("talk");
const elWho     = document.getElementById("who");
const elLine    = document.getElementById("line");
const elProg    = document.getElementById("prog");
const elCurtain = document.getElementById("curtain");
const elEnd     = document.getElementById("end");
const elHeadNm  = document.getElementById("headName");
const elSnd     = document.getElementById("snd");

let story = null, i = 0, started = false, soundOn = true;
const audio = new Audio();

function open(c){
  if (!c.ready){
    alert(c.title + " は準備中です。\nいまは「鹿苑寺（金閣寺）」をお聞きいただけます。");
    return;
  }
  fetch("stories/" + c.dir + "/story.json")
    .then(function(r){ if(!r.ok) throw new Error("story.json が読めません"); return r.json(); })
    .then(function(d){
      story = d; story._dir = c.dir;
      i = 0; started = false;
      elHeadNm.textContent = d.title;
      document.getElementById("curTitle").textContent = d.title + " に着きました";
      document.getElementById("curQ").textContent = d.question || "";
      drawStage(d.scene);
      elProg.innerHTML = d.scenes.map(function(){ return "<i></i>"; }).join("");
      elCurtain.classList.remove("hide");
      elEnd.classList.remove("on");
      elTalk.style.display = "";
      elProg.style.display = "";
      elList.classList.add("off");
      elPlay.classList.add("on");
      document.getElementById("notice").style.display = "none";
      draw();
      window.scrollTo(0,0);
    })
    .catch(function(e){ alert("読み込みに失敗しました。" + e.message); });
}

function toList(){
  audio.pause();
  elPlay.classList.remove("on");
  elList.classList.remove("off");
  document.getElementById("notice").style.display = "";
  elHeadNm.textContent = "文明の軌跡";
  drawList();
  window.scrollTo(0,0);
}

function draw(){
  const s = story.scenes[i];
  elWho.textContent = s.who;
  elLine.textContent = s.text;
  elTalk.className = "talk " + (s.type === "nav" ? "is-nav" : "is-yos");
  updateStage();
  const dots = Array.prototype.slice.call(elProg.children);
  dots.forEach(function(d, n){ d.className = (n <= i ? "on" : ""); });
}

function playCurrent(){
  if (!soundOn) return;
  const s = story.scenes[i];
  if (!s.voice) return;
  audio.src = story._dir ? ("stories/" + story._dir + "/" + (story.voiceDir || "voice") + "/" + s.voice) : "";
  const p = audio.play();
  if (p && p.catch) p.catch(function(){ /* 自動再生が止められても読み進められる */ });
}

function advance(){
  if (!started){ started = true; elCurtain.classList.add("hide"); playCurrent(); return; }
  if (i < story.scenes.length - 1){ i++; draw(); playCurrent(); return; }
  finish();
}

function finish(){
  audio.pause();
  markSeen(story._dir);
  elTalk.style.display = "none";
  elProg.style.display = "none";
  elEnd.classList.add("on");
}

audio.addEventListener("ended", function(){
  if (i < story.scenes.length - 1){ i++; draw(); playCurrent(); }
  else { finish(); }
});

elPlay.addEventListener("click", function(e){
  if (e.target.closest(".btn")) return;
  if (e.target.closest(".end")) return;
  advance();
});

elSnd.addEventListener("click", function(){
  soundOn = !soundOn;
  elSnd.textContent = soundOn ? "音声を止める" : "音声を鳴らす";
  elSnd.classList.toggle("off", !soundOn);
  if (!soundOn) audio.pause(); else playCurrent();
});
document.getElementById("back").addEventListener("click", toList);
document.getElementById("toList").addEventListener("click", toList);

/* ───── 背景の絵と人物。生成した画像を敷き、人物は右に立たせる ─────
   絵が無い場所では、これまでどおり SVG で描く（読み込み失敗時も同じ） */
let elBg = null, elCh = null;
function drawStage(name){
  elBg = elCh = null;
  if (!story || !story._dir){ elStage.innerHTML = SCENE[name] || SCENE._default; return; }
  elStage.innerHTML = "";
  const base = "stories/" + story._dir + "/";
  const bg = document.createElement("img");
  bg.className = "bg"; bg.alt = "";
  bg.onerror = function(){ elStage.innerHTML = SCENE[name] || SCENE._default; elBg = elCh = null; };
  bg.src = base + "bg/" + name + ".jpg";
  elStage.appendChild(bg); elBg = bg;
  if (story.chara && story.chara.file){
    const ch = document.createElement("img");
    ch.className = "ch off"; ch.alt = "";
    ch.onerror = function(){ ch.remove(); elCh = null; };
    ch.src = base + story.chara.file;
    elStage.appendChild(ch); elCh = ch;
  }
}

/* 場面ごとに背景を差し替える（story.json の bg があれば優先） */
function updateStage(){
  const s = story.scenes[i];
  if (elBg){
    const want = "stories/" + story._dir + "/bg/" + (s.bg || story.scene) + ".jpg";
    if (!elBg.src.endsWith(want)) elBg.src = want;
  }
  /* 人物はその人の台詞のときだけ出す。ナレーションでは引っ込める */
  if (elCh) elCh.classList.toggle("off", s.type === "nav");
}
const SCENE = {
  _default:
    '<svg viewBox="0 0 720 400" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="720" height="400" fill="#d9d2c0"/>' +
      '<path d="M0 250 L160 170 L300 245 L440 160 L580 240 L720 180 L720 400 L0 400Z" fill="#b9b19a"/>' +
    '</svg>',

  /* 金閣。三層＋池。色は生成りに合わせて彩度を落としてある */
  kinkakuji:
    '<svg viewBox="0 0 720 400" preserveAspectRatio="xMidYMid slice">' +
      '<defs>' +
        '<linearGradient id="k1" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#dcd4c0"/><stop offset="1" stop-color="#c6bda4"/></linearGradient>' +
        '<linearGradient id="k2" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#c9a227"/><stop offset="1" stop-color="#a8811a"/></linearGradient>' +
        '<linearGradient id="k3" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#8e9a96"/><stop offset="1" stop-color="#6d7a78"/></linearGradient>' +
      '</defs>' +
      '<rect width="720" height="400" fill="url(#k1)"/>' +
      '<path d="M0 190 L120 130 L250 185 L380 120 L520 180 L640 135 L720 175 L720 400 L0 400Z" fill="#a9b0a0" opacity=".7"/>' +
      '<g transform="translate(250 95) scale(.8)">' +
        '<rect x="78" y="0"  width="140" height="46" fill="url(#k2)"/>' +
        '<path d="M62 4 L234 4 L206 -20 L90 -20Z" fill="#3a352c"/>' +
        '<rect x="52" y="54" width="192" height="60" fill="url(#k2)"/>' +
        '<path d="M32 58 L264 58 L232 30 L64 30Z" fill="#3a352c"/>' +
        '<rect x="26" y="122" width="244" height="72" fill="#e3dac6"/>' +
        '<path d="M2 126 L294 126 L262 96 L34 96Z" fill="#3a352c"/>' +
        '<g stroke="#a99e85" stroke-width="2">' +
          '<line x1="62" y1="128" x2="62" y2="194"/><line x1="110" y1="128" x2="110" y2="194"/>' +
          '<line x1="186" y1="128" x2="186" y2="194"/><line x1="234" y1="128" x2="234" y2="194"/></g>' +
        '<rect x="14" y="194" width="268" height="10" fill="#544d40"/>' +
      '</g>' +
      '<rect y="262" width="720" height="138" fill="url(#k3)"/>' +
      '<g stroke="#b6c0bb" stroke-width="1.4" opacity=".45">' +
        '<line x1="90"  y1="288" x2="270" y2="288"/><line x1="420" y1="300" x2="640" y2="300"/>' +
