<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歩く物語 ─ 鹿苑寺（金閣寺）</title>
<style>
  :root{
    --gold:#c9a227; --gold-l:#e8cf7a; --paper:#f6f1e6;
    --nav-bg:rgba(28,26,23,.86); --yos-bg:rgba(74,55,14,.92);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:#14120f; color:var(--paper);
    display:flex; justify-content:center; min-height:100vh;
  }
  .app{
    width:100%; max-width:900px; position:relative;
    display:flex; flex-direction:column; min-height:100vh;
    background:linear-gradient(#1b2a3a 0%, #3d5a6c 45%, #6d7f6a 100%);
    overflow:hidden; cursor:pointer;
  }
  .bar{
    position:relative; z-index:3; display:flex; align-items:center; gap:10px;
    padding:12px 16px; background:rgba(20,18,15,.55);
  }
  .pin{width:22px;height:22px;flex:none}
  .spot{font-size:15px;font-weight:700;letter-spacing:.02em}
  .spot small{display:block;font-size:11px;font-weight:400;opacity:.75}
  .status{margin-left:auto;display:flex;gap:14px;text-align:right}
  .stat{font-size:11px;opacity:.8;line-height:1.4}
  .stat b{display:block;font-size:15px;color:var(--gold-l);letter-spacing:.02em}
  .scene{position:absolute; inset:0; z-index:1}
  .scene svg{width:100%;height:100%;display:block}
  .talk{ position:relative; z-index:3; margin-top:auto; padding:0 14px 16px; }
  .speaker{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em;
    padding:5px 14px; border-radius:6px 6px 0 0; transform:translateY(1px);
  }
  .box{
    border-radius:0 10px 10px 10px; padding:18px 18px 14px;
    line-height:2; font-size:16px; letter-spacing:.02em;
    border:1px solid rgba(255,255,255,.14);
    min-height:158px; display:flex; flex-direction:column;
  }
  .is-nav .speaker{background:var(--nav-bg);color:#e7e2d6}
  .is-nav .box{background:var(--nav-bg)}
  .is-yos .speaker{background:var(--yos-bg);color:var(--gold-l)}
  .is-yos .box{background:var(--yos-bg);border-color:rgba(201,162,39,.45)}
  .line{white-space:pre-wrap}
  .next{
    margin-top:auto; align-self:flex-end; display:flex; align-items:center; gap:8px;
    background:none;border:none;color:inherit;cursor:pointer;
    font:inherit; font-size:13px; opacity:.85; padding:6px 2px;
  }
  .next span{
    width:22px;height:22px;border-radius:50%;
    border:1px solid currentColor; display:grid;place-items:center; font-size:11px;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  .prog{ display:flex;gap:4px;justify-content:center;padding:0 14px 14px;position:relative;z-index:3; }
  .prog i{height:3px;flex:1;background:rgba(255,255,255,.18);border-radius:2px}
  .prog i.on{background:var(--gold)}
  .snd{
    flex:none; margin-left:12px; width:34px;height:34px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:var(--gold-l); cursor:pointer; display:grid;place-items:center; padding:0;
  }
  .snd svg{width:19px;height:19px}
  .snd.off{color:rgba(255,255,255,.45)}
  .start{
    position:absolute; inset:0; z-index:6; display:grid; place-items:center;
    background:rgba(12,11,9,.72); text-align:center; padding:24px;
  }
  .start.hide{display:none}
  .start .t{font-size:19px;font-weight:700;letter-spacing:.03em;margin-bottom:14px}
  .start .s{font-size:14px;opacity:.85;margin-bottom:8px}
  .start .s2{font-size:12px;opacity:.6}
  .speaking{
    display:inline-flex; gap:3px; align-items:flex-end; height:12px; margin-left:8px;
    vertical-align:middle;
  }
  .speaking i{width:2.5px;background:currentColor;border-radius:1px;animation:snd 1s ease-in-out infinite}
  .speaking i:nth-child(1){height:5px;animation-delay:0s}
  .speaking i:nth-child(2){height:11px;animation-delay:.18s}
  .speaking i:nth-child(3){height:7px;animation-delay:.36s}
  @keyframes snd{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .speaking.hide{display:none}
  .stat .sm{display:none}
  @media (max-width:520px){
    .box{font-size:15px;line-height:1.95;min-height:172px}
    .bar{padding:10px 12px;gap:7px}
    .spot{font-size:13px;white-space:nowrap}
    .spot small{font-size:10px}
    .status{gap:9px}
    .stat{font-size:10px}
    .stat b{font-size:13px}
    .stat .lg{display:none}
    .stat .sm{display:inline}
    .snd{width:30px;height:30px;margin-left:8px}
    .snd svg{width:17px;height:17px}
    .start .t{font-size:17px}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="bar">
    <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="#e8cf7a" stroke-width="1.8">
      <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>
    </svg>
    <div class="spot">鹿苑寺（金閣寺）<small>京都府 京都市北区</small></div>
    <div class="status">
      <div class="stat"><span class="lg">きょう歩いた距離</span><span class="sm">歩いた距離</span><b>3.4 km</b></div>
      <div class="stat"><span class="lg">語り部レベル</span><span class="sm">レベル</span><b>7</b></div>
    </div>
    <button class="snd" id="snd" title="音声のオン・オフ" aria-label="音声のオン・オフ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 9h4l5-4v14l-5-4H4z"/>
        <g id="wave"><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M19 7a7 7 0 0 1 0 10"/></g>
        <g id="mute" style="display:none"><path d="M17 9.5l4 5M21 9.5l-4 5"/></g>
      </svg>
    </button>
  </div>

  <div class="start" id="start">
    <div>
      <p class="t">鹿苑寺（金閣寺）に着きました</p>
      <p class="s">画面を押すと、物語が始まります</p>
      <p class="s2">音声が流れます。イヤホンをお使いください</p>
    </div>
  </div>

  <div class="scene">
    <svg id="scene" viewBox="0 0 900 620" preserveAspectRatio="xMidYMax slice" aria-label="金閣の風景">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2a3a"/><stop offset="1" stop-color="#5b7286"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f0d98a"/><stop offset="1" stop-color="#b8901c"/>
        </linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#efe7d4"/><stop offset="1" stop-color="#cdbfa4"/>
        </linearGradient>
        <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#41586a"/><stop offset="1" stop-color="#22303c"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#e8cf7a" stop-opacity=".16"/>
          <stop offset="1" stop-color="#e8cf7a" stop-opacity="0"/>
        </radialGradient>
        <filter id="ripple" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <rect width="900" height="620" fill="url(#sky)"/>
      <path d="M0 300 L150 200 L280 285 L420 175 L560 280 L700 205 L900 300 L900 620 L0 620Z" fill="#2f4438" opacity=".75"/>
      <path d="M0 340 L180 265 L340 335 L500 255 L660 330 L820 270 L900 320 L900 620 L0 620Z" fill="#38513f" opacity=".85"/>

      <circle cx="448" cy="250" r="240" fill="url(#glow)"/>

      <g id="pavilion" transform="translate(300 120)">
        <rect x="78" y="0" width="140" height="52" fill="url(#gold)"/>
        <path d="M62 4 L234 4 L206 -22 L90 -22Z" fill="#2c2a24"/>
        <g fill="#e8cf7a">
          <path d="M148 -26 C142 -34 144 -44 150 -48 C152 -42 156 -40 158 -36 C162 -40 164 -44 163 -49 C170 -43 170 -32 162 -27 Z"/>
          <path d="M148 -26 L136 -33 L146 -31 Z"/>
        </g>
        <rect x="52" y="60" width="192" height="66" fill="url(#gold)"/>
        <path d="M32 64 L264 64 L232 34 L64 34Z" fill="#2c2a24"/>
        <rect x="26" y="134" width="244" height="80" fill="url(#wood)"/>
        <path d="M2 138 L294 138 L262 106 L34 106Z" fill="#2c2a24"/>
        <g stroke="#9d8f74" stroke-width="2">
          <line x1="62" y1="140" x2="62" y2="214"/><line x1="110" y1="140" x2="110" y2="214"/>
          <line x1="186" y1="140" x2="186" y2="214"/><line x1="234" y1="140" x2="234" y2="214"/>
        </g>
        <rect x="14" y="214" width="268" height="12" fill="#4b4639"/>
      </g>

      <rect y="360" width="900" height="260" fill="url(#pond)"/>
      <use href="#pavilion" transform="translate(0 720) scale(1 -1)"
           opacity=".13" filter="url(#ripple)"/>
      <g stroke="#8ea6b4" stroke-width="1.6" opacity=".3">
        <line x1="120" y1="392" x2="330" y2="392"/><line x1="520" y1="404" x2="770" y2="404"/>
        <line x1="200" y1="432" x2="470" y2="432"/><line x1="560" y1="452" x2="810" y2="452"/>
      </g>
      <g fill="#25382c">
        <path d="M46 372 L82 292 L118 372Z"/><rect x="78" y="366" width="8" height="26"/>
        <path d="M792 380 L822 314 L852 380Z"/><rect x="818" y="374" width="8" height="24"/>
      </g>
    </svg>
  </div>

  <div class="talk is-nav" id="talk">
    <div class="speaker"><span id="speakerName">ナレーション</span><span class="speaking hide" id="speaking"><i></i><i></i><i></i></span></div>
    <div class="box">
      <div class="line" id="line"></div>
      <button class="next" id="next">つづき <span>▼</span></button>
    </div>
  </div>

  <div class="prog" id="prog"></div>
</div>

<script>
const script = [
  {id:"N1", who:"ナレーション", type:"nav", text:"目の前の建物を、もう一度よく見てください。\n\n上の二つの層は金色に光っています。でも、いちばん下の層だけは、金色ではありません。\n\n塗り忘れたわけではありません。これは、六百年以上前に、ひとりの人物がわざとそうさせたものです。"},
  {id:"Y1", who:"足利義満", type:"yos", text:"わしの名は足利義満。室町幕府の三代将軍じゃ。\n\n応永四年、西暦でいえば一三九七年。わしはこの山を手に入れた。もとは西園寺という貴族の別荘があった土地じゃ。荒れ果てておったのを、わしが譲り受けた。\n\nここに建てたのが、いま目の前にあるものよ。北山殿と呼ばせた。"},
  {id:"N2", who:"ナレーション", type:"nav", text:"義満がこの建物にこめたものは、金の輝きだけではありませんでした。\n\n三つの層は、それぞれ建て方が違います。"},
  {id:"Y2", who:"足利義満", type:"yos", text:"いちばん下は、法水院。貴族の屋敷の造りじゃ。\n\n二つ目は、潮音洞。武士の館の造りにした。\n\nそして三つ目、究竟頂。これは禅の寺の造りよ。"},
  {id:"N3", who:"ナレーション", type:"nav", text:"貴族の造り、武士の造り、寺の造り。\n\nまったく違う三つを、ひとつの建物に積み上げる。ふつうはやりません。"},
  {id:"Y3", who:"足利義満", type:"yos", text:"やったのだ。\n\nわしは武士の頭領として幕府を握った。そのうえで、貴族としても位を極めた。そして最後には、髪を落として僧となった。\n\n三つとも、わしのものよ。ならば三つとも、この建物に積んでよかろう。\n\nそして金を貼ったのは、上の二層だけじゃ。いちばん下の貴族の層には、貼らせなかった。"},
  {id:"N4", who:"ナレーション", type:"nav", text:"なぜ、いちばん下だけ金がないのか。\n\nその理由を、義満自身が書き残したものは見つかっていません。「貴族より武士のほうが上だと示したのだ」と読む人もいますが、それは後の世の人の見方です。\n\n分かっているのは、そういう形になっている、ということだけです。"},
  {id:"Y4", who:"足利義満", type:"yos", text:"わしは応永十五年、この北山殿で死んだ。五十一であった。\n\n死ぬ前に言い残した。ここを寺にせよ、と。"},
  {id:"N5", who:"ナレーション", type:"nav", text:"義満の望みどおり、北山殿は禅寺になりました。義満の法号「鹿苑院殿」から名を取り、鹿苑寺と呼ばれるようになります。\n\n金閣寺というのは、その中の金色の建物から生まれた呼び名です。"},
  {id:"N6", who:"ナレーション", type:"nav", text:"最後に、ひとつだけ。\n\nいま見ているこの建物は、義満が建てたそのものではありません。\n\n昭和二十五年、一九五〇年に、放火によって焼け落ちました。いま立っているのは、五年後の昭和三十年に建て直されたものです。"},
  {id:"Y5", who:"足利義満", type:"yos", text:"焼けたか。\n\n……よい。また建てたのであろう。\n\nわしが建てさせたときも、この山には何もなかった。荒れた別荘があっただけよ。\n\n見るがよい。おぬしの目の前に、今も建っておる。"},
  {id:"N7", who:"ナレーション", type:"nav", text:"三つの層を、下から順に見上げてみてください。\n\n貴族の造り、武士の造り、禅の寺の造り。\n\n六百年前の人が、何を積み上げようとしたのか。それが、そこに立っています。"}
];

const elLine = document.getElementById("line");
const elSpeaker = document.getElementById("speakerName");
const elTalk = document.getElementById("talk");
const elProg = document.getElementById("prog");
const elNext = document.getElementById("next");
let i = 0;

script.forEach(function(){ elProg.insertAdjacentHTML("beforeend", "<i></i>"); });
const dots = Array.prototype.slice.call(elProg.children);

function draw(){
  const s = script[i];
  elSpeaker.textContent = s.who;
  elLine.textContent = s.text;
  elTalk.className = "talk " + (s.type === "yos" ? "is-yos" : "is-nav");
  dots.forEach(function(d, n){ d.classList.toggle("on", n <= i); });
  elNext.style.visibility = (i === script.length - 1) ? "hidden" : "visible";
}
// 音声
const audio = new Audio();
audio.preload = "auto";
const elSnd = document.getElementById("snd");
const elSpeaking = document.getElementById("speaking");
const elStart = document.getElementById("start");
let soundOn = true;
let started = false;

function setSoundIcon(){
  elSnd.classList.toggle("off", !soundOn);
  document.getElementById("wave").style.display = soundOn ? "" : "none";
  document.getElementById("mute").style.display = soundOn ? "none" : "";
}
function playCurrent(){
  audio.pause();
  elSpeaking.classList.add("hide");
  if (!soundOn || !started) return;
  audio.src = "voice/" + script[i].id + ".m4a";
  const p = audio.play();
  if (p && p.catch) p.catch(function(){ elSpeaking.classList.add("hide"); });
}
audio.addEventListener("playing", function(){ elSpeaking.classList.remove("hide"); });
audio.addEventListener("pause", function(){ elSpeaking.classList.add("hide"); });
audio.addEventListener("ended", function(){
  elSpeaking.classList.add("hide");
  if (i < script.length - 1){ i++; draw(); playCurrent(); }
});
elSnd.addEventListener("click", function(e){
  e.stopPropagation();
  soundOn = !soundOn;
  setSoundIcon();
  if (soundOn) playCurrent(); else audio.pause();
});
setSoundIcon();

function advance(){
  if (!started){ started = true; elStart.classList.add("hide"); playCurrent(); return; }
  if (i < script.length - 1){ i++; draw(); playCurrent(); }
}
document.getElementById("app").addEventListener("click", advance);

// 縦長の画面では絵が横に切れるので、描画する範囲を広げて全体を収める
const elScene = document.getElementById("scene");
function fitScene(){
  const w = document.getElementById("app").clientWidth;
  const h = window.innerHeight;
  const ratio = w / h;
  if (ratio < 0.75){
    elScene.setAttribute("viewBox", "-230 -120 1360 760");
  } else if (ratio < 1.05){
    elScene.setAttribute("viewBox", "-110 -60 1120 690");
  } else {
    elScene.setAttribute("viewBox", "0 0 900 620");
  }
}
window.addEventListener("resize", fitScene);
fitScene();
draw();
</script>
</body>
</html>
