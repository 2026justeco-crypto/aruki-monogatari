<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歩く物語 ─ 黒部ダム（動きの試作）</title>
<style>
  :root{ --gold:#c9a227; --gold-l:#e8cf7a; --paper:#f6f1e6; --nav-bg:rgba(28,26,23,.86); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:#0e1113; color:var(--paper);
    display:flex; justify-content:center; min-height:100vh;
  }
  .app{
    width:100%; max-width:900px; position:relative;
    display:flex; flex-direction:column; min-height:100vh;
    overflow:hidden; background:#0e1113;
  }

  /* ---- 背景の写真 ---- */
  .scene{position:absolute; inset:0; z-index:1; overflow:hidden}
  .photo{
    position:absolute; inset:-4%;
    background:url("img/kurobe.jpg") 12% 45% / cover no-repeat;
    animation:kenburns 18s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes kenburns{
    from{transform:scale(1.03) translate(0,0)}
    to  {transform:scale(1.22) translate(-3.2%, 3.6%)}
  }

  /* ---- 放水（ジェット）のゆらぎ ---- */
  .jet{
    position:absolute; left:3%; top:50%; width:78%; height:38%;
    z-index:2; pointer-events:none; overflow:hidden;
    -webkit-mask-image:radial-gradient(ellipse 62% 78% at 34% 18%, #000 12%, transparent 72%);
            mask-image:radial-gradient(ellipse 62% 78% at 34% 18%, #000 12%, transparent 72%);
  }
  .jet i{
    position:absolute; left:-14%; width:130%; height:26%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
    filter:blur(5px); opacity:0;
    animation:rush 1.5s linear infinite;
  }
  .jet i:nth-child(1){top:0%;  animation-delay:0s;   animation-duration:1.3s}
  .jet i:nth-child(2){top:18%; animation-delay:.3s;  animation-duration:1.7s}
  .jet i:nth-child(3){top:38%; animation-delay:.6s;  animation-duration:1.4s}
  .jet i:nth-child(4){top:58%; animation-delay:.9s;  animation-duration:1.9s}
  @keyframes rush{
    0%  {transform:translate(-18%, -14%) scaleX(.7); opacity:0}
    18% {opacity:1}
    72% {opacity:.7}
    100%{transform:translate(16%, 26%) scaleX(1.25); opacity:0}
  }

  /* ---- 落下点の水煙 ---- */
  .mist{
    position:absolute; left:22%; bottom:0; width:78%; height:26%;
    z-index:2; pointer-events:none; overflow:hidden;
  }
  .mist i{
    position:absolute; bottom:-24%; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,0) 68%);
    filter:blur(13px); opacity:0;
    animation:rise 5s ease-in-out infinite;
  }
  .mist i:nth-child(1){left:2%;  width:46%; height:70%; animation-delay:0s}
  .mist i:nth-child(2){left:26%; width:56%; height:88%; animation-delay:1.6s; animation-duration:6s}
  .mist i:nth-child(3){left:52%; width:44%; height:66%; animation-delay:3.2s; animation-duration:4.5s}
  @keyframes rise{
    0%  {transform:translateY(14%) scale(.86); opacity:0}
    26% {opacity:.72}
    68% {opacity:.5}
    100%{transform:translateY(-36%) scale(1.22); opacity:0}
  }

  /* ---- 虹 ---- */
  .rainbow{
    position:absolute; left:47%; top:59%; width:21%; height:11%;
    z-index:2; pointer-events:none; border-radius:50%;
    background:conic-gradient(from 210deg,
      rgba(255,120,120,0) 0deg, rgba(255,170,90,.5) 24deg, rgba(255,235,120,.55) 40deg,
      rgba(150,235,150,.5) 56deg, rgba(140,190,255,.45) 72deg, rgba(190,150,255,0) 96deg);
    filter:blur(4px);
    animation:shimmer 3.6s ease-in-out infinite;
    transform:rotate(-14deg);
  }
  @keyframes shimmer{
    0%,100%{opacity:.3}
    45%    {opacity:.95}
  }

  /* ---- 飛沫の粒 ---- */
  .drops{position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden}
  .drops i{
    position:absolute; width:3px;height:3px;border-radius:50%;
    background:rgba(255,255,255,.85); filter:blur(.6px); opacity:0;
    animation:drift 6s linear infinite;
  }
  @keyframes drift{
    0%  {transform:translate(0,0) scale(.6); opacity:0}
    12% {opacity:.9}
    100%{transform:translate(var(--dx), var(--dy)) scale(1.3); opacity:0}
  }

  /* ---- 手前の暗がり ---- */
  .vignette{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:
      linear-gradient(rgba(10,14,16,.42) 0%, rgba(10,14,16,0) 26%),
      linear-gradient(transparent 52%, rgba(8,11,13,.72) 100%);
  }

  /* ---- 画面の部品 ---- */
  .bar{
    position:relative; z-index:4; display:flex; align-items:center; gap:10px;
    padding:12px 16px; background:rgba(20,18,15,.5);
  }
  .pin{width:22px;height:22px;flex:none}
  .spot{font-size:15px;font-weight:700}
  .spot small{display:block;font-size:11px;font-weight:400;opacity:.75}
  .status{margin-left:auto;display:flex;gap:14px;text-align:right}
  .stat{font-size:11px;opacity:.8;line-height:1.4}
  .stat b{display:block;font-size:15px;color:var(--gold-l)}
  .talk{position:relative; z-index:4; margin-top:auto; padding:0 14px 16px}
  .speaker{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em;
    padding:5px 14px; border-radius:6px 6px 0 0; transform:translateY(1px);
    background:var(--nav-bg); color:#e7e2d6;
  }
  .box{
    border-radius:0 10px 10px 10px; padding:18px; line-height:2; font-size:16px; white-space:pre-line;
    background:var(--nav-bg); border:1px solid rgba(255,255,255,.14);
  }
  .note{
    position:relative; z-index:4; text-align:center; font-size:11px;
    opacity:.55; padding:0 14px 14px;
  }
  @media (max-width:520px){
    .box{font-size:15px;line-height:1.95}
    .spot{font-size:13px}
    .stat{font-size:10px}
    .stat b{font-size:13px}
  }
</style>
</head>
<body>
<div class="app">

  <div class="scene">
    <div class="photo"></div>
    <div class="jet"><i></i><i></i><i></i><i></i></div>
    <div class="mist"><i></i><i></i><i></i></div>
    <div class="rainbow"></div>
    <div class="drops" id="drops"></div>
    <div class="vignette"></div>
  </div>

  <div class="bar">
    <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="#e8cf7a" stroke-width="1.8">
      <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>
    </svg>
    <div class="spot">黒部ダム<small>富山県 中新川郡立山町</small></div>
    <div class="status">
      <div class="stat">きょう歩いた距離<b>6.1 km</b></div>
      <div class="stat">語り部レベル<b>8</b></div>
    </div>
  </div>

  <div class="talk">
    <div class="speaker">ナレーション</div>
    <div class="box">
      音の大きさに、まず驚かれたと思います。

      いま目の前で落ちている水は、毎秒10トン以上。この放水は、夏のあいだだけ行われます。
    </div>
  </div>

  <div class="note">※動きの試作です。文章は仮のもので、数字はまだ確かめていません。</div>
</div>

<script>
// 飛沫の粒をばらまく（放水のあたりから舞い上がる）
const drops = document.getElementById("drops");
for (let n = 0; n < 26; n++){
  const d = document.createElement("i");
  const x = 5 + Math.random() * 70;      // 放水の帯のあたり
  const y = 55 + Math.random() * 32;
  d.style.left = x + "%";
  d.style.top = y + "%";
  d.style.setProperty("--dx", (Math.random() * 90 - 20) + "px");
  d.style.setProperty("--dy", (-40 - Math.random() * 110) + "px");
  d.style.animationDelay = (Math.random() * 6) + "s";
  d.style.animationDuration = (4 + Math.random() * 4) + "s";
  drops.appendChild(d);
}
</script>
</body>
</html>
